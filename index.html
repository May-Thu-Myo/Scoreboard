<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div>
                <h3>HOME</h3>
                <div class="scorebox">
                    <p id="home-score"></p>
                </div>
                <div class="btn">
                    <button id="plusOne" onclick="addOneHome()">+1</button>
                    <button id="plusTwo" onclick="addTwoHome()">+2</button>
                    <button id="plusFive" onclick="addFiveHome()">+5</button>
                </div>
            </div>
            <div>
                <h3>GUEST</h3>
                <div class="scorebox">
                    <p id="guest-score"></p>
                </div>
                <div class="btn">
                    <button id="plusOne" onclick="addOneGuest()">+1</button>
                    <button id="plusTwo" onclick="addTwoGuest()">+2</button>
                    <button id="plusFive" onclick="addFiveGuest()">+5</button>
                </div>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
